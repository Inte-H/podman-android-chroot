# Defaults for a stock Android kernel: stop podman from asking for features the kernel lacks,
# and confine containers with the features that are there.
[containers]
# No PID or IPC namespaces (CONFIG_PID_NS, CONFIG_SYSVIPC off)
pidns = "host"
ipcns = "host"
# The bridge network needs nftables, which the kernel lacks. slirp4netns gives the container
# its own network namespace and a way out without any firewall rule on the phone
netns = "slirp4netns"
# No pids cgroup controller (CONFIG_CGROUP_PIDS off)
pids_limit = 0
# No message queue filesystem (CONFIG_POSIX_MQUEUE off), so the default mqueue mount fails
mounts = ["type=tmpfs,destination=/dev/mqueue"]
# A /proc that hides other users' processes (enter.sh mounts it). It hides nothing from a
# container that runs as root
volumes = ["/run/podman-proc:/proc"]

[engine]
# systemd is not running
cgroup_manager = "cgroupfs"
events_logger = "file"
hooks_dir = ["/etc/containers/oci/hooks.d"]
